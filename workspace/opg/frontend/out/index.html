<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPG - Oldschool Pixel Games</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>OPG</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="/"><span class="icon">🏠</span><span>Studio</span></a>
        <a href="/live"><span class="icon">🔴</span><span>Live</span></a>
        <a href="/paint"><span class="icon">🎨</span><span>Paint</span></a>
        <a href="/animate"><span class="icon">🎬</span><span>Animate</span></a>
        <a href="/assets"><span class="icon">📦</span><span>Assets</span></a>
        <a href="/code"><span class="icon">💻</span><span>Code</span></a>
        <a href="/preview"><span class="icon">▶️</span><span>Preview</span></a>
        <a href="/iterate"><span class="icon">🔄</span><span>Iterate</span></a>
        <a href="/export"><span class="icon">📤</span><span>Export</span></a>
        <a href="/settings"><span class="icon">⚙️</span><span>Settings</span></a>
        <a href="/admin"><span class="icon">🛡️</span><span>Admin</span></a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-title" id="page-title">Studio</div>
        <div class="topbar-spacer"></div>
        <div id="job-status" class="badge badge-info">Ready</div>
      </header>
      <div class="content" id="page-content">
        <!-- Page content injected here -->
      </div>
    </main>
  </div>
  <script>
    const API_BASE = '';
    const EVENT_BASE = '';
    function navigate(path) {
      window.location.href = path;
    }
    async function api(path, opts = {}) {
      const res = await fetch(API_BASE + path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || res.statusText);
      }
      if (res.status === 204) return null;
      return res.json();
    }
    function connectSSE(path, onMessage) {
      const url = new URL(EVENT_BASE + path, window.location.origin);
      const es = new EventSource(url.href);
      es.onmessage = (e) => onMessage(JSON.parse(e.data));
      es.onerror = () => { es.close(); };
      return es;
    }
    function setActiveNav(path) {
      document.querySelectorAll('.sidebar-nav a').forEach((a) => {
        a.classList.toggle('active', a.getAttribute('href') === path);
      });
    }
    document.addEventListener('DOMContentLoaded', () => {
      setActiveNav(window.location.pathname);
    });
  </script>
</body>
</html>
