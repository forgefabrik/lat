<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export - OPG</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header"><h1>OPG</h1></div>
      <nav class="sidebar-nav">
        <a href="/"><span class="icon">🏠</span><span>Studio</span></a>
        <a href="/live"><span class="icon">🔴</span><span>Live</span></a>
        <a href="/paint"><span class="icon">🎨</span><span>Paint</span></a>
        <a href="/animate"><span class="icon">🎬</span><span>Animate</span></a>
        <a href="/assets"><span class="icon">📦</span><span>Assets</span></a>
        <a href="/code"><span class="icon">💻</span><span>Code</span></a>
        <a href="/preview"><span class="icon">▶️</span><span>Preview</span></a>
        <a href="/iterate"><span class="icon">🔄</span><span>Iterate</span></a>
        <a href="/export"><span class="icon">📤</span><span>Export</span></a>
        <a href="/settings"><span class="icon">⚙️</span><span>Settings</span></a>
        <a href="/admin"><span class="icon">🛡️</span><span>Admin</span></a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">Export</div>
        <div class="topbar-spacer"></div>
        <div id="job-status" class="badge badge-info">Ready</div>
      </header>
      <div class="content">
        <div class="grid grid-3">
          <div class="card">
            <h3>HTML5 Game</h3>
            <p style="color:var(--text-secondary);margin-bottom:12px;">Playable standalone HTML5 package ready to host anywhere.</p>
            <button class="btn btn-primary">Download ZIP</button>
          </div>
          <div class="card">
            <h3>Assets</h3>
            <p style="color:var(--text-secondary);margin-bottom:12px;">PNG spritesheets and GIF animations.</p>
            <button class="btn btn-primary">Download Assets</button>
          </div>
          <div class="card">
            <h3>Source</h3>
            <p style="color:var(--text-secondary);margin-bottom:12px;">GameSpec JSON + level data + source template.</p>
            <button class="btn btn-primary">Download Source</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
