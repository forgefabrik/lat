<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - OPG</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header"><h1>OPG</h1></div>
      <nav class="sidebar-nav">
        <a href="/"><span class="icon">🏠</span><span>Studio</span></a>
        <a href="/live"><span class="icon">🔴</span><span>Live</span></a>
        <a href="/paint"><span class="icon">🎨</span><span>Paint</span></a>
        <a href="/animate"><span class="icon">🎬</span><span>Animate</span></a>
        <a href="/assets"><span class="icon">📦</span><span>Assets</span></a>
        <a href="/code"><span class="icon">💻</span><span>Code</span></a>
        <a href="/preview"><span class="icon">▶️</span><span>Preview</span></a>
        <a href="/iterate"><span class="icon">🔄</span><span>Iterate</span></a>
        <a href="/export"><span class="icon">📤</span><span>Export</span></a>
        <a href="/settings"><span class="icon">⚙️</span><span>Settings</span></a>
        <a href="/admin"><span class="icon">🛡️</span><span>Admin</span></a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">Settings</div>
        <div class="topbar-spacer"></div>
        <div id="job-status" class="badge badge-info">Ready</div>
      </header>
      <div class="content">
        <div class="card">
          <h3>Provider Configuration</h3>
          <div style="margin-bottom:16px;">
            <label style="color:var(--text-secondary);display:block;margin-bottom:4px;">OpenRouter API Key</label>
            <input class="input" type="password" placeholder="sk-or-...">
          </div>
          <div style="margin-bottom:16px;">
            <label style="color:var(--text-secondary);display:block;margin-bottom:4px;">NVIDIA API Key</label>
            <input class="input" type="password" placeholder="nvapi-...">
          </div>
          <div style="margin-bottom:16px;">
            <label style="color:var(--text-secondary);display:block;margin-bottom:4px;">Default Model</label>
            <select class="select"><option>auto</option><option>gpt-4o</option><option>claude-3.5-sonnet</option></select>
          </div>
          <button class="btn btn-primary">Save Settings</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
