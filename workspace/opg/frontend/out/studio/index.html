<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio - OPG</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header"><h1>OPG</h1></div>
      <nav class="sidebar-nav">
        <a href="/"><span class="icon">🏠</span><span>Studio</span></a>
        <a href="/live"><span class="icon">🔴</span><span>Live</span></a>
        <a href="/paint"><span class="icon">🎨</span><span>Paint</span></a>
        <a href="/animate"><span class="icon">🎬</span><span>Animate</span></a>
        <a href="/assets"><span class="icon">📦</span><span>Assets</span></a>
        <a href="/code"><span class="icon">💻</span><span>Code</span></a>
        <a href="/preview"><span class="icon">▶️</span><span>Preview</span></a>
        <a href="/iterate"><span class="icon">🔄</span><span>Iterate</span></a>
        <a href="/export"><span class="icon">📤</span><span>Export</span></a>
        <a href="/settings"><span class="icon">⚙️</span><span>Settings</span></a>
        <a href="/admin"><span class="icon">🛡️</span><span>Admin</span></a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">Studio</div>
        <div class="topbar-spacer"></div>
        <div id="job-status" class="badge badge-info">Ready</div>
      </header>
      <div class="content">
        <div class="card">
          <h3>🎮 New Game Idea</h3>
          <textarea class="textarea" id="game-idea" placeholder="Describe your game idea...&#10;&#10;Example: A dark SNES platformer about a frog knight exploring a swamp fortress to defeat the Slime King."></textarea>
        </div>
        <div class="grid grid-3" style="margin-bottom: 12px;">
          <div>
            <label class="select" style="display:block;margin-bottom:4px;color:var(--text-secondary);">Provider</label>
            <select class="select" id="provider">
              <option value="openrouter">OpenRouter</option>
              <option value="nvidia">NVIDIA</option>
              <option value="kilo">Kilo</option>
            </select>
          </div>
          <div>
            <label class="select" style="display:block;margin-bottom:4px;color:var(--text-secondary);">Style</label>
            <select class="select" id="style">
              <option value="snes">SNES (16-bit)</option>
              <option value="gameboy">Game Boy</option>
              <option value="nes">NES (8-bit)</option>
              <option value="pico8">PICO-8</option>
              <option value="modern">Modern Pixel</option>
            </select>
          </div>
          <div>
            <label class="select" style="display:block;margin-bottom:4px;color:var(--text-secondary);">Template</label>
            <select class="select" id="template">
              <option value="auto">Auto</option>
              <option value="platformer">Platformer</option>
              <option value="topdown">Top-Down</option>
              <option value="shooter">Shooter</option>
              <option value="rpg">RPG Lite</option>
            </select>
          </div>
        </div>
        <div class="card">
          <label class="input" style="display:block;margin-bottom:4px;color:var(--text-secondary);">API Key (session only, not stored)</label>
          <input class="input" type="password" id="api-key" placeholder="Enter your provider API key...">
        </div>
        <button class="btn btn-primary" id="generate-btn" onclick="generateGame()">🚀 Generate Game</button>
        <div id="result" style="margin-top: 16px;"></div>
      </div>
    </main>
  </div>
  <script>
    async function generateGame() {
      const idea = document.getElementById('game-idea').value.trim();
      if (!idea) return alert('Please enter a game idea');
      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
      btn.textContent = 'Generating...';
      document.getElementById('job-status').textContent = 'Running';
      document.getElementById('job-status').className = 'badge badge-warning';
      try {
        const res = await api('/api/games/generate', {
          method: 'POST',
          body: {
            idea,
            provider: document.getElementById('provider').value,
            apiKey: document.getElementById('api-key').value,
            style: document.getElementById('style').value,
            template: document.getElementById('template').value,
            quality: 'high',
          },
        });
        document.getElementById('result').innerHTML = '<div class="card"><h3>✅ Game Created!</h3><p>Game ID: ' + res.gameId + '</p><p>Job: ' + res.jobId + '</p><a class="btn btn-primary" href="/live">View Live Progress →</a></div>';
      } catch (e) {
        document.getElementById('result').innerHTML = '<div class="card" style="border-color:var(--error);"><h3>❌ Error</h3><p>' + e.message + '</p></div>';
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Generate Game';
      }
    }
    document.getElementById('game-idea').value = 'A dark SNES platformer about a frog knight exploring a swamp fortress to defeat the Slime King.';
  </script>
</body>
</html>
