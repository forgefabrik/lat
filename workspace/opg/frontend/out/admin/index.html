<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - OPG</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header"><h1>OPG</h1></div>
      <nav class="sidebar-nav">
        <a href="/"><span class="icon">🏠</span><span>Studio</span></a>
        <a href="/live"><span class="icon">🔴</span><span>Live</span></a>
        <a href="/paint"><span class="icon">🎨</span><span>Paint</span></a>
        <a href="/animate"><span class="icon">🎬</span><span>Animate</span></a>
        <a href="/assets"><span class="icon">📦</span><span>Assets</span></a>
        <a href="/code"><span class="icon">💻</span><span>Code</span></a>
        <a href="/preview"><span class="icon">▶️</span><span>Preview</span></a>
        <a href="/iterate"><span class="icon">🔄</span><span>Iterate</span></a>
        <a href="/export"><span class="icon">📤</span><span>Export</span></a>
        <a href="/settings"><span class="icon">⚙️</span><span>Settings</span></a>
        <a href="/admin"><span class="icon">🛡️</span><span>Admin</span></a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">Admin</div>
        <div class="topbar-spacer"></div>
        <div id="job-status" class="badge badge-info">Ready</div>
      </header>
      <div class="content">
        <div class="grid grid-3">
          <div class="card">
            <h3>Users</h3>
            <div style="font-size:24px;font-weight:700;">0</div>
          </div>
          <div class="card">
            <h3>Games</h3>
            <div style="font-size:24px;font-weight:700;" id="stat-games">-</div>
          </div>
          <div class="card">
            <h3>Jobs</h3>
            <div style="font-size:24px;font-weight:700;" id="stat-jobs">-</div>
          </div>
        </div>
        <div class="card">
          <h3>Recent Jobs</h3>
          <pre id="admin-jobs" style="background:var(--bg-primary);padding:12px;border-radius:var(--radius);font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);max-height:300px;overflow:auto;">Loading...</pre>
        </div>
      </div>
    </main>
  </div>
  <script>
    api('/api/admin/stats').then(s => {
      document.getElementById('stat-games').textContent = s.games;
      document.getElementById('stat-jobs').textContent = s.jobs.total;
    }).catch(() => {
      document.getElementById('stat-jobs').textContent = 'n/a';
      document.getElementById('stat-games').textContent = 'n/a';
    });
    api('/api/admin/jobs').then(r => {
      document.getElementById('admin-jobs').textContent = JSON.stringify(r.jobs.slice(0, 10), null, 2);
    }).catch(() => {
      document.getElementById('admin-jobs').textContent = 'unavailable';
    });
  </script>
</body>
</html>
