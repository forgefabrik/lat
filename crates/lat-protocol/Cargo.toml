[package]
name = "lat-protocol"
version = "0.1.0"
edition = "2021"
description = "Shared types and event definitions for the LAT simulation"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "rt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[lib]
path = "src/lib.rs"
